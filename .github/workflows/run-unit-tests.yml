name: Run Unit Tests

on: [push]

jobs:
  run-unit-tests:
    name: Run unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: action/steup-node@v3
        with: 
        node--version: 26
        cache: 'npm'

      - run: npm ci

      - run: npm run test